<title>Acadelime</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Lexend:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;
  --lime-500:#B5D334;--lime-300:#D4EE4E;--lime-100:#E8F5B0;--lime-700:#5C7A0A;--lime-text:#5C7A0A;
  --ink-900:#1B2B1E;--ink-500:#5D6B4F;--text:#1B2B1E;--text-2:#5D6B4F;
  --line:#DCE3C4;--trail:#DCE3C4;--locked-bg:#E6EAD9;--locked-fg:#8A9479;--locked-label:#7C866D;
  --paper:#FBFCF2;--surface:#FFFFFF;--bar:#1B2B1E;--bar-line:transparent;
  --accent:#6B4EFF;--accent-text:#6B4EFF;--accent-50:#EDE9FF;--accent-800:#3B2A99;
  --info-bg:#E6F0FB;--info-fg:#174A87;--ok-bg:#E8F5B0;--ok-fg:#3A4A10;--bad-bg:#FDE8E6;--bad-fg:#9B2A20;
  --warn-bg:#FEF3C7;--warn-fg:#8A4B06;--neutral-bg:#EDEFE6;--neutral-fg:#3B4A3C;
  --danger:#C2362B;--on-danger:#FFFFFF;--emph-bg:#1B2B1E;--emph-fg:#D4EE4E;--sec-border:#1B2B1E;
  --page:#E9EDDD;
}
:root[data-theme="dark"]{color-scheme:dark;
  --lime-text:#D4EE4E;--text:#EEF3E2;--text-2:#A9B59A;--ink-500:#A9B59A;
  --line:#34443A;--trail:#3F5144;--locked-bg:#26322A;--locked-fg:#7E8A72;--locked-label:#8E9A82;
  --paper:#111A13;--surface:#1A251C;--bar:#0A110B;--bar-line:#34443A;
  --accent-text:#A898FF;--accent-50:#2A2350;--accent-800:#C9BFFF;
  --info-bg:#13304F;--info-fg:#9CC7F5;--ok-bg:#33410F;--ok-fg:#E0F29A;--bad-bg:#4A1A16;--bad-fg:#F5ABA3;
  --warn-bg:#4A3208;--warn-fg:#F8CF7A;--neutral-bg:#26322A;--neutral-fg:#B8C2A8;
  --danger:#E5544A;--on-danger:#1B0B09;--emph-bg:#D4EE4E;--emph-fg:#1B2B1E;--sec-border:#EEF3E2;
  --page:#070C08;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);font-family:Lexend,system-ui,sans-serif;color:var(--text);display:flex;justify-content:center;align-items:center;padding-block:24px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));box-sizing:border-box}
h1,h2,h3,.display{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;margin:0}
button{font-family:inherit;cursor:pointer}
.phone{width:390px;height:min(820px,100%);min-width:0;background:var(--paper);border-radius:40px;border:10px solid #0A110B;overflow:hidden;display:flex;flex-direction:column;position:relative;flex-shrink:0}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden}
.top{background:var(--bar);border-bottom:1px solid var(--bar-line);color:var(--lime-300);display:flex;align-items:center;gap:8px;padding:14px 14px 12px}
.logo{display:flex;align-items:center;gap:6px;font-family:'Bricolage Grotesque';font-weight:700;font-size:17px;color:var(--lime-300)}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:3px;font-size:12px;padding:4px 8px;border-radius:999px;background:#2E4231;color:#E8F5B0}
.org{font-size:11px;background:#2E4231;color:#E8F5B0;padding:4px 8px;border-radius:6px;font-weight:500}
.iconbtn{background:none;border:none;color:inherit;font-size:20px;padding:4px;position:relative;line-height:1}
.dot{position:absolute;top:2px;right:2px;width:8px;height:8px;border-radius:50%;background:var(--lime-300);border:2px solid var(--bar)}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--surface)}
.tabs button{flex:1;background:none;border:none;padding:10px 0 14px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--text-2)}
.tabs button i{font-size:22px}
.tabs button.on{color:var(--text);font-weight:500}
.tabs button.on i{background:var(--lime-500);color:var(--ink-900);border-radius:10px;padding:2px 14px}
.pad{padding:16px}
.head{display:flex;align-items:center;gap:8px;padding:14px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.head h2{font-size:17px;flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.muted{color:var(--text-2);font-size:13px}
.small{font-size:12px}
.chip{display:inline-block;font-size:12px;padding:3px 9px;border-radius:6px;font-weight:500}
.c-info{background:var(--info-bg);color:var(--info-fg)}.c-ok{background:var(--ok-bg);color:var(--ok-fg)}.c-bad{background:var(--bad-bg);color:var(--bad-fg)}
.c-warn{background:var(--warn-bg);color:var(--warn-fg)}.c-neu{background:var(--neutral-bg);color:var(--neutral-fg)}.c-acc{background:var(--accent-50);color:var(--accent-800)}
.btn{border:none;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:500;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.b-pri{background:var(--lime-500);color:#1B2B1E}.b-emp{background:var(--emph-bg);color:var(--emph-fg)}
.b-sec{background:transparent;color:var(--text);border:1.5px solid var(--sec-border)}.b-gho{background:transparent;color:var(--lime-text)}
.b-dan{background:var(--danger);color:var(--on-danger)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);font-family:inherit;font-size:15px}
.seg{display:flex;background:var(--locked-bg);border-radius:12px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;border:none;background:none;padding:8px 4px;border-radius:9px;font-size:13px;color:var(--text-2)}
.seg button.on{background:var(--surface);color:var(--text);font-weight:500}
.bh{margin:16px 16px 0;background:var(--lime-500);color:#1B2B1E;border-radius:16px;padding:12px 14px;position:sticky;top:0;z-index:5}
.bh.lock{background:var(--locked-bg);color:var(--text-2)}
.path{position:relative}
.node{position:absolute;width:60px;height:60px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:24px;border:none;z-index:2}
.halo{position:absolute;width:80px;height:80px;border-radius:24px;background:var(--lime-300);z-index:1}
.nl{position:absolute;font-size:12px;line-height:1.3;width:120px;z-index:2}
.nl b{display:block;font-weight:500;font-size:11px;color:var(--text-2)}
.prog{height:10px;background:var(--locked-bg);border-radius:999px;overflow:hidden;flex:1}
.prog span{display:block;height:100%;background:var(--lime-500);border-radius:999px}
.opt{display:block;width:100%;text-align:left;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);font-size:15px;margin-bottom:10px}
.opt.sel{border-color:var(--sec-border);border-width:2px}
.opt.good{background:var(--ok-bg);border-color:var(--lime-500);color:var(--ok-fg)}
.opt.wrong{background:var(--bad-bg);border-color:var(--danger);color:var(--bad-fg)}
.big{width:96px;height:96px;border-radius:28px;display:flex;align-items:center;justify-content:center;font-size:48px;margin:24px auto 16px}
.center{text-align:center}
.list button,.listitem{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;border-bottom:1px solid var(--line);padding:14px 0;color:var(--text);font-size:15px;text-align:left}
.ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.days{display:flex;gap:6px;margin-bottom:16px}
.days div{flex:1;text-align:center;padding:8px 0;border-radius:12px;font-size:12px;color:var(--text-2);background:var(--surface);border:1px solid var(--line)}
.days div b{display:block;font-size:16px;color:var(--text);font-family:'Bricolage Grotesque'}
.days div.on{background:var(--lime-500);border-color:var(--lime-500);color:#3A4A10}.days div.on b{color:#1B2B1E}
.drop{border:2px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--text-2);font-size:13px;margin-bottom:12px}
.cam{background:#0A110B;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#EEF3E2;gap:18px;padding:24px}
.frame{width:230px;height:230px;border:4px solid var(--lime-300);border-radius:28px;display:flex;align-items:center;justify-content:center;font-size:64px;color:#34443A}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.check input{width:20px;height:20px;accent-color:#5C7A0A;margin-top:1px}
.cert{background:#FFFFFF;color:#1B2B1E;border:1px solid #DCE3C4;border-radius:16px;padding:26px 18px;text-align:center}
.orglogo{display:inline-block;font-family:'Bricolage Grotesque';font-weight:700;font-size:26px;border:3px solid #1B2B1E;padding:2px 16px;border-radius:8px}
.toast{position:absolute;left:16px;right:16px;bottom:84px;background:var(--emph-bg);color:var(--emph-fg);padding:12px 14px;border-radius:12px;font-size:14px;z-index:20;display:none}
@media (max-width:500px){body{padding:0}.phone{border:none;border-radius:0;width:100%;height:100%}}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --lime-text:#D4EE4E;--text:#EEF3E2;--text-2:#A9B59A;--ink-500:#A9B59A;
  --line:#34443A;--trail:#3F5144;--locked-bg:#26322A;--locked-fg:#7E8A72;--locked-label:#8E9A82;
  --paper:#111A13;--surface:#1A251C;--bar:#0A110B;--bar-line:#34443A;
  --accent-text:#A898FF;--accent-50:#2A2350;--accent-800:#C9BFFF;
  --info-bg:#13304F;--info-fg:#9CC7F5;--ok-bg:#33410F;--ok-fg:#E0F29A;--bad-bg:#4A1A16;--bad-fg:#F5ABA3;
  --warn-bg:#4A3208;--warn-fg:#F8CF7A;--neutral-bg:#26322A;--neutral-fg:#B8C2A8;
  --danger:#E5544A;--on-danger:#1B0B09;--emph-bg:#D4EE4E;--emph-fg:#1B2B1E;--sec-border:#EEF3E2;
  --page:#070C08;
}}
i.ti{display:inline-flex;width:1em;height:1em;vertical-align:-0.14em;flex-shrink:0}
i.ti svg{width:100%;height:100%}
.tabs button.on i.ti{width:auto;height:auto}
.tabs i.ti svg{width:22px;height:22px}
.top{gap:6px}
button:focus-visible,input:focus-visible{outline:2px solid var(--lime-text);outline-offset:2px}
@media (max-width:400px){.top .logo{font-size:15px}.top .logo svg{width:18px;height:18px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

function pathHTML(b, locked) {
  const W = 358, C = W / 2, GAP = 80, cur = nextId();
  const pts = b.nodos.map((n, i) => ({ x: C + ZIGZAG[i % 8], y: 50 + i * GAP }));
  const H = 50 + (b.nodos.length - 1) * GAP + 60;
  let lastDone = -1; b.nodos.forEach((n, i) => { if (S.done[n.id]) lastDone = i; });
  const seg = (a, z) => { let d = `M${pts[a].x} ${pts[a].y}`; for (let i = a + 1; i <= z; i++) d += ` C${pts[i - 1].x} ${pts[i - 1].y + 40} ${pts[i].x} ${pts[i].y - 40} ${pts[i].x} ${pts[i].y}`; return d; };
  const reach = Math.min(lastDone + 1, b.nodos.length - 1);
  let svg = `<svg width="${W}" height="${H}" style="position:absolute;left:0;top:0" aria-hidden="true">`;
  if (!locked && reach > 0) svg += `<path d="${seg(0, reach)}" fill="none" stroke="#B5D334" stroke-width="8" stroke-linecap="round"/>`;
  const startP = locked ? 0 : reach;
  if (startP < b.nodos.length - 1) svg += `<path d="${seg(startP, b.nodos.length - 1)}" fill="none" stroke="var(--trail)" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 12"/>`;
  svg += '</svg>';
  const nodes = b.nodos.map((n, i) => {
    const p = pts[i], off = ZIGZAG[i % 8], done = !!S.done[n.id], isCur = !locked && n.id === cur;
    let style, icon = ICON[n.tipo], lblColor = '', extra = '';
    if (done) { style = 'background:#B5D334;color:#1B2B1E'; icon = n.tipo === 'autoeval' ? 'ti-trophy' : 'ti-check'; }
    else if (isCur) { style = 'background:#1B2B1E;color:#D4EE4E'; extra = `<div class="halo" style="left:${p.x - 40}px;top:${p.y - 40}px"></div>`; }
    else if (n.tipo === 'autoeval') { style = 'background:var(--accent-50);color:var(--accent-text)'; lblColor = 'color:var(--accent-text)'; }
    else { style = 'background:var(--locked-bg);color:var(--locked-fg)'; icon = 'ti-lock'; lblColor = 'color:var(--locked-label)'; }
    const right = off <= 0;
    const lx = right ? `left:${p.x + 40 + (isCur ? 8 : 0)}px` : `right:${W - p.x + 40}px;text-align:right`;
    const open = done || isCur;
    return `${extra}<button class="node" style="left:${p.x - 30}px;top:${p.y - 30}px;${style}" ${open ? `data-node="${n.id}"` : 'data-locked'} aria-label="${n.et}: ${n.ti}${done ? ', completado' : isCur ? ', siguiente' : ', bloqueado'}"><i class="ti ${icon}"></i></button>
      <div class="nl" style="${lx};top:${p.y - 18}px;${lblColor}"><b style="${isCur ? 'color:var(--lime-text)' : n.tipo === 'autoeval' && !done ? 'color:var(--accent-text)' : ''}">${n.et}${isCur ? ' · seguí acá' : ''}</b>${n.ti}</div>`;
  }).join('');
  return `<div class="path" style="height:${H}px;margin:16px">${svg}${nodes}</div>`;
}

  perfil: () => shell(`<div class="pad"><div class="row" style="margin-bottom:16px"><div class="ico" style="width:56px;height:56px;border-radius:18px;background:var(--lime-500);color:#1B2B1E;font-family:'Bricolage Grotesque';font-weight:700;font-size:20px">MF</div>
      <div><h2 style="font-size:19px">María Fernández</h2><div class="muted">maria.fernandez@correo.com</div></div></div>
    <div class="row" style="gap:10px;margin-bottom:6px"><button class="card" data-go="tienda" style="flex:1;margin:0;text-align:left;color:var(--text)"><div class="muted small">Limes</div><div class="display" style="font-size:22px">${COIN(18)} ${S.xp}</div><div class="small" style="color:var(--lime-text);margin-top:2px">Ir a la tienda</div></button>
      <div class="card" style="flex:1;margin:0"><div class="muted small">Racha</div><div class="display" style="font-size:22px">${S.racha} semanas</div></div></div>
    <p class="small muted" style="margin:6px 0 10px">La racha suma una semana cada vez que completás al menos un nodo. Los limes no cambian tus notas.</p>
    <div class="list">${[['tienda', 'ti-building-store', 'Tienda de limes'], ['trayectoria', 'ti-timeline', 'Mi trayectoria'], ['certificados', 'ti-certificate', 'Certificados'], ['notificaciones', 'ti-bell', 'Notificaciones']].map(([g, ic, t]) => `<button data-go="${g}"><span class="ico" style="background:var(--lime-100);color:#3A4A10"><i class="ti ${ic}"></i></span><span style="flex:1">${t}</span><i class="ti ti-chevron-right"></i></button>`).join('')}
      <div class="listitem"><span class="ico" style="background:var(--neutral-bg);color:var(--neutral-fg)"><i class="ti ti-map-pin"></i></span><span style="flex:1">Sede<br><span class="muted small">La asigna un administrador</span></span><span class="small">Sede Centro</span></div></div>
    <div style="margin:16px 0 8px;font-size:13px;font-weight:500">Apariencia</div>
    <div class="seg">${[['light', 'Claro'], ['dark', 'Oscuro'], ['system', 'Sistema']].map(([id, l]) => `<button data-theme-set="${id}" class="${S.themePref === id ? 'on' : ''}">${l}</button>`).join('')}</div>
    <button class="btn b-sec" data-go="login" data-root><i class="ti ti-logout"></i>Cerrar sesión</button></div>`),
  trayectoria: () => plain(`${head('Mi trayectoria')}<div class="pad">
    ${[{ n: 'Autonomía digital personal', e: ['Cursando', 'c-info'], nota: '—', asis: S.presente ? '1 de 10 clases' : '0 de 10 clases', auto: S.done.a1 ? 'Bloque 1: ' + S.quiz.ok + '/4' : 'Todavía ninguna', acr: '—' },
       { n: 'Alfabetización digital inicial', e: ['Aprobado', 'c-ok'], nota: '9', asis: '11 de 12 clases', auto: '6 bloques · promedio 85%', acr: '—', cert: true },
       { n: 'Redes sociales seguras', e: ['Abandonado', 'c-bad'], nota: '—', asis: '2 de 8 clases', auto: '1 bloque', acr: '—' }].map(c => `
      <div class="card"><div class="between"><h3 style="font-size:16px">${c.n}</h3><span class="chip ${c.e[1]}">${c.e[0]}</span></div>
      ${[['Nota', c.nota], ['Asistencia', c.asis], ['Autoevaluaciones', c.auto], ['Acreditaciones', c.acr]].map(([k, v]) => `<div class="between" style="padding:5px 0;font-size:14px"><span class="muted">${k}</span><span>${v}</span></div>`).join('')}
      ${c.cert ? '<button class="btn b-sec" style="margin-top:8px;padding:9px;font-size:13px" data-go="certificado"><i class="ti ti-certificate"></i>Ver certificado</button>' : ''}</div>`).join('')}
    ${S.acreditacion ? `<div class="card"><div class="between"><h3 style="font-size:16px">Acreditación · ${S.acreditacion}</h3><span class="chip c-warn">En revisión</span></div><div class="muted" style="margin-top:4px">Competencia: Planillas de cálculo</div></div>` : ''}</div>`),
  certificados: () => plain(`${head('Certificados')}<div class="pad"><button class="card row" data-go="certificado" style="width:100%;text-align:left;color:var(--text)"><span class="ico" style="background:var(--lime-100);color:#3A4A10"><i class="ti ti-certificate"></i></span><span style="flex:1"><b style="font-weight:500">Alfabetización digital inicial</b><br><span class="muted">UTEC · 28 jun 2026</span></span><i class="ti ti-chevron-right"></i></button>
    <p class="muted small center">Obtenés un certificado cada vez que aprobás un curso.</p></div>`),
  certificado: () => plain(`${head('Certificado')}<div class="pad"><div class="cert"><div class="orglogo">UTEC</div>
    <p style="font-size:13px;margin:18px 0 4px;color:#5D6B4F">certifica que</p><h2 style="font-size:24px">María Fernández</h2><p style="font-size:13px;margin:4px 0 0;color:#5D6B4F">DNI 30.123.456</p>
    <p style="font-size:14px;margin:8px 0 2px;color:#5D6B4F">aprobó el curso</p><h3 style="font-size:18px">Alfabetización digital inicial</h3>
    <p style="font-size:13px;color:#5D6B4F;margin:6px 0 22px">Sede Centro · 28 de junio de 2026</p>
    <div style="display:flex;justify-content:space-around;margin-bottom:20px">${['Firma · Dirección', 'Firma · Docente'].map(f => `<div style="font-size:11px;color:#5D6B4F;border-top:1px solid #1B2B1E;padding-top:4px;width:110px">${f}</div>`).join('')}</div>
    <p style="font-size:11px;color:#7C866D;margin:0">emitido con <b style="color:#1B2B1E">acadelime</b> · código AC-7F3K-92QD</p></div>
    <button class="btn b-pri" style="margin-top:16px" data-toast="Se descarga el PDF del certificado"><i class="ti ti-download"></i>Descargar PDF</button>
    <button class="btn b-gho" data-toast="Se copia el enlace de verificación"><i class="ti ti-link"></i>Copiar enlace de verificación</button></div>`),
  tienda: () => { const t = S.tiendaTab; const seg = `<div class="seg">${[['tienda', 'Tienda'], ['mis', 'Mis canjes']].map(([id, l]) => `<button data-ttab="${id}" class="${t === id ? 'on' : ''}">${l}</button>`).join('')}</div>`;
    const saldo = `<div class="card" style="background:var(--lime-500);border-color:var(--lime-500);color:#1B2B1E"><div class="small" style="color:#3A4A10">Tus limes</div><div class="display" style="font-size:28px">${COIN(26)} ${S.xp}</div><div class="small" style="color:#3A4A10;margin-top:4px">Los ganás completando temas, resúmenes, prácticas y autoevaluaciones. Sirven para todos tus cursos.</div></div>`;
    let body;
    if (t === 'tienda') body = TIENDA.map(it => { const own = S.canjes.includes(it.id), falta = it.p - S.xp, lock = !own && falta > 0;
      return `<div class="card" style="${lock ? 'background:var(--locked-bg);border-color:var(--locked-bg)' : ''}"><div class="row" style="align-items:flex-start"><span class="ico" style="${lock ? 'background:var(--surface);color:var(--locked-fg)' : it.tipo === 'Video' ? 'background:var(--info-bg);color:var(--info-fg)' : 'background:var(--accent-50);color:var(--accent-text)'}"><i class="ti ${lock ? 'ti-lock' : it.ic}"></i></span>
        <div style="flex:1"><span class="chip ${it.tipo === 'Video' ? 'c-info' : 'c-acc'}" style="font-size:11px">${it.tipo}</span><h3 style="font-size:15px;margin-top:6px;${lock ? 'color:var(--text-2)' : ''}">${it.t}</h3><div class="muted" style="margin-top:2px">${it.d}</div><div class="small muted" style="margin-top:4px"><i class="ti ti-user"></i> ${it.prof}</div></div></div>
        <div style="margin-top:12px">${own ? '<button class="btn b-sec" style="padding:9px;font-size:13px" data-toast="Abre el material canjeado"><i class="ti ti-check"></i>Canjeado · abrir</button>'
          : lock ? `<div class="between"><span style="font-weight:500">${COIN(16)} ${it.p}</span><span class="small muted"><i class="ti ti-lock"></i> Te faltan ${falta} limes</span></div>`
          : `<button class="btn b-pri" style="padding:10px;font-size:14px" data-go="canje" data-item="${it.id}">Canjear por ${COIN(16)} ${it.p}</button>`}</div></div>`; }).join('');
    else body = S.canjes.length ? S.canjes.map(id => { const it = TIENDA.find(x => x.id === id); return `<div class="card row"><span class="ico" style="background:var(--lime-100);color:#3A4A10"><i class="ti ${it.ic}"></i></span><span style="flex:1"><b style="font-weight:500">${it.t}</b><br><span class="muted small">${it.tipo} · ${it.p} limes</span></span><button class="btn b-sec" style="width:auto;padding:8px 12px;font-size:13px" data-toast="Abre el material canjeado">Abrir</button></div>`; }).join('')
      : `<div class="center" style="padding:30px 10px"><div class="big" style="background:var(--lime-100);color:#3A4A10;width:72px;height:72px;font-size:34px"><i class="ti ti-building-store"></i></div><h3 style="font-size:17px">Tu primer canje te espera</h3><p class="muted">Lo que canjees queda acá para abrirlo cuando quieras.</p><button class="btn b-pri" data-ttab="tienda">Ver la tienda</button></div>`;
    return plain(`${head('Tienda de limes')}<div class="pad">${saldo}${seg}${body}</div>`); },
  canje: () => { const it = TIENDA.find(x => x.id === S.canjeId) || TIENDA[0], queda = S.xp - it.p; return `<div style="flex:1;background:rgba(10,17,11,.55);display:flex;align-items:flex-end">
    <div style="background:var(--paper);width:100%;border-radius:24px 24px 0 0;padding:22px 16px 26px"><div style="width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 18px"></div>
    <span class="chip ${it.tipo === 'Video' ? 'c-info' : 'c-acc'}">${it.tipo}</span><h2 style="font-size:21px;margin:8px 0 4px">${it.t}</h2><p class="muted" style="margin:0 0 4px">${it.d}</p><p class="small muted" style="margin:0 0 16px"><i class="ti ti-user"></i> Material de ${it.prof} · acceso para siempre</p>
    <div class="card">${[['Precio', `${COIN(16)} ${it.p}`], ['Tus limes', `${COIN(16)} ${S.xp}`], ['Te quedan', `${COIN(16)} ${queda}`]].map(([k, v], i) => `<div class="between" style="padding:5px 0;${i === 2 ? 'border-top:1px solid var(--line);margin-top:4px;padding-top:9px;font-weight:500' : ''}"><span class="${i === 2 ? '' : 'muted'}">${k}</span><span>${v}</span></div>`).join('')}</div>
    ${queda < 0 ? `<div class="card c-warn" style="border:none;font-size:14px"><i class="ti ti-lock"></i> Te faltan ${-queda} limes para canjear esto.</div><button class="btn b-sec" data-back>Volver a la tienda</button>`
      : `<button class="btn b-pri" data-canjear="${it.id}">Canjear</button><button class="btn b-gho" style="margin-top:4px" data-back>Cancelar</button>`}</div></div>`; },
  canjeOk: () => { const it = TIENDA.find(x => x.id === S.canjeId) || TIENDA[0]; return plain(`<div class="pad center" style="padding-top:90px"><div class="big" style="background:var(--lime-500);color:#1B2B1E"><i class="ti ${it.ic}"></i></div>
    <h2 style="font-size:24px">Ya es tuyo</h2><p class="muted">${it.t}<br>Te quedan ${S.xp} limes.</p>
    <button class="btn b-pri" style="margin-top:20px" data-toast="Abre el material canjeado">Abrir ahora</button>
    <button class="btn b-gho" data-go="tienda" data-ttab="mis" data-root>Ver mis canjes</button></div>`); },
  notificaciones: () => { S.unread = 0; return plain(`${head('Notificaciones')}<div class="pad" style="padding-top:4px"><div class="list">
    ${[['ti-calendar', 'c-ok', 'Hoy tenés Clase 01 a las 18:00', 'Sede Centro · hace 2 h', 'clase'], ['ti-door-enter', 'c-info', 'Abrió la inscripción a Planillas de cálculo', 'Cierra el 30 nov · ayer', 'curso'], ['ti-circle-x', 'c-neu', 'Tu pedido a Redes en casa fue rechazado', 'Cupo completo · 3 nov', 'pedidos'], ['ti-certificate', 'c-ok', 'Obtuviste el certificado de Alfabetización digital inicial', '28 jun', 'certificado']].map(([ic, c, t, s, g]) => `<button ${g === 'pedidos' ? 'data-go="cursos" data-tab="pedidos"' : g === 'curso' ? 'data-go="curso" data-id="planillas"' : `data-go="${g}"`}><span class="ico ${c}"><i class="ti ${ic}"></i></span><span style="flex:1;font-size:14px">${t}<br><span class="muted small">${s}</span></span></button>`).join('')}</div></div>`); }
};
const TABS = ['inicio', 'cursos', 'calendario', 'perfil'];

function render() {
  document.getElementById('screen').innerHTML = V[S.screen]();
  const sc = document.querySelector('#screen .scroll'); if (sc) sc.scrollTop = 0;
}
function go(screen, opts = {}) {
  if (screen === 'aprender') S.tab = 'inicio';
  if (opts.root || TABS.includes(screen)) { S.history = screen === 'aprender' ? ['inicio'] : []; } else if (S.screen !== screen) S.history.push(S.screen);
  if (TABS.includes(screen)) S.tab = screen;
  S.screen = screen; render();
}
function back() { S.screen = S.history.pop() || S.tab; render(); }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 2200); }
function complete(id, titulo, sub) {
  const n = ALL.find(x => x.id === id); let xp = 0;
  if (!S.done[id]) { S.done[id] = true; xp = XP[n.tipo]; S.xp += xp; }
  S.logro = { titulo, sub: xp ? sub : 'Ya lo habías completado: los limes se ganan una sola vez.', xp };
  S.history = []; S.screen = 'logro'; render();
}
function setTheme(pref) {
  S.themePref = pref;
  if (pref === 'system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = pref;
}

document.addEventListener('input', e => { const er = e.target.closest('.field') && document.querySelector('#rec-err,#nc-err'); if (er) er.textContent = ''; });
document.addEventListener('click', e => {
  const el = e.target.closest('button,[data-go],[data-tabgo],input');
  if (!el) return;
  const d = el.dataset;
  if (d.tab) S.cursosTab = d.tab;
  if (d.id) S.curso = d.id;
  if (d.item) S.canjeId = d.item;
  if (d.ttab) { S.tiendaTab = d.ttab; if (!d.go) { render(); return; } }
  if (d.go) return go(d.go, { root: 'root' in d });
  if (d.tabgo) return go(d.tabgo);
  if ('back' in d) return back();
  if (d.toast) return toast(d.toast);
  if ('locked' in d) return toast('Se desbloquea al completar el nodo anterior');
  if (d.node) {
    const n = ALL.find(x => x.id === d.node);
    if (n.tipo === 'tema') { S.temaPaso = 0; S.temaId = n.id; }
    if (n.tipo === 'autoeval') S.quiz = { i: 0, sel: null, checked: false, ok: 0 };
    return go(n.tipo);
  }
  if ('temanext' in d) { if (S.temaPaso < TEMA.length - 1) { S.temaPaso++; render(); } else complete(S.temaId || 't3', 'Tema completado', 'Unidades de medida'); return; }
  if (d.pcheck !== undefined) { S.practica[d.pcheck] = el.checked; render(); return; }
  if (d.need) return toast(d.need);
  if (d.complete) return complete(d.complete, d.complete === 'r1' ? 'Resumen repasado' : 'Práctica terminada', d.complete === 'r1' ? 'Ya estás listo para la autoevaluación' : 'Ficha técnica de mi PC');
  if (d.opt !== undefined) { S.quiz.sel = +d.opt; render(); return; }
  if ('qcheck' in d) { if (S.quiz.sel === null) { document.getElementById('qerr').textContent = 'Elegí una respuesta primero'; return; } S.quiz.checked = true; if (S.quiz.sel === QUIZ[S.quiz.i].c) S.quiz.ok++; render(); return; }
  if ('qnext' in d) {
    if (S.quiz.i < QUIZ.length - 1) { S.quiz.i++; S.quiz.sel = null; S.quiz.checked = false; render(); }
    else { if (!S.done.a1) { S.done.a1 = true; S.xp += Math.round(XP.autoeval * S.quiz.ok / QUIZ.length); } S.history = []; S.screen = 'autoevalRes'; render(); }
    return;
  }
  if ('retry' in d) { S.quiz = { i: 0, sel: null, checked: false, ok: 0 }; S.history = []; S.screen = 'autoeval'; render(); return; }
  if (d.ctab) { S.cursosTab = d.ctab; render(); return; }
  if ('pedir' in d) { S.pedidoPlanillas = true; S.history = []; S.screen = 'pedidoOk'; render(); return; }
  if (d.acsend) { S.acreditacion = d.acsend; S.history = []; S.screen = 'acOk'; render(); return; }
  if (d.canjear) { const it = TIENDA.find(x => x.id === d.canjear); if (S.xp >= it.p && !S.canjes.includes(it.id)) { S.xp -= it.p; S.canjes.push(it.id); } S.history = []; S.screen = 'canjeOk'; render(); return; }
  if ('recsend' in d) { const v = document.getElementById('rec-mail').value.trim(); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) { document.getElementById('rec-err').textContent = 'Escribí un correo válido'; return; } return go('olvideEnviado'); }
  if ('newpass' in d) { const a = document.getElementById('nc1').value, b = document.getElementById('nc2').value, er = document.getElementById('nc-err');
    if (a.length < 8) { er.textContent = 'La contraseña necesita al menos 8 caracteres'; return; }
    if (a !== b) { er.textContent = 'Las contraseñas no coinciden'; return; }
    S.history = []; S.screen = 'claveOk'; render(); return; }
  if ('scan' in d) { S.presente = true; S.history = []; S.screen = 'qrOk'; render(); return; }
  if (d.themeSet) { setTheme(d.themeSet); render(); return; }
});
const h = location.hash.slice(1); if (h && V[h]) go(h, { root: true }); else render();

paintIcons();
new MutationObserver(() => paintIcons(document.getElementById('phone'))).observe(document.getElementById('phone'), { childList: true, subtree: true });
</script>
